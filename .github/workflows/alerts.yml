name: CP Alerts

on:
  schedule:
    - cron: '37 9 * * 1,5'   # 09:37 UTC = 10:37 UK summer time (09:37 in winter); off the hour to avoid GitHub dropping runs
  workflow_dispatch:          # adds a "Run workflow" button for testing

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node app.js
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
